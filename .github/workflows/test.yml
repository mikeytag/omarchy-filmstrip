name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Python syntax
        run: python3 -m py_compile install.py bin/omarchy-filmstrip tests/*.py
      - name: Test installation and rollback
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
